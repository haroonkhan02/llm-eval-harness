# MT-Bench human judgments (lmsys, CC-BY-4.0). Not gated.
dataset:
  repo_id: lmsys/mt_bench_human_judgments
  revision: main
  local_dir: data/mtbench

agreement:
  # Cluster bootstrap over MT-Bench questions (votes on the same question are correlated).
  n_boot: 2000
  seed: 0
  # "tie (inconsistent)" = GPT-4 changed its verdict when A/B were swapped.
  inconsistent_as: tie

judge:
  backend: anthropic
  model: claude-opus-5-5
  effort: low
  max_tokens: 4000

# MT-Bench human judgments (lmsys, CC-BY-4.0). Not gated.
dataset:
  repo_id: lmsys/mt_bench_human_judgments
  revision: f7d2896d2cc5d80f8b55c2bbc722613555233c25  # pinned commit
  local_dir: data/mtbench

agreement:
  # Cluster bootstrap over MT-Bench questions (votes on the same question are correlated).
  n_boot: 2000
  seed: 0
  # "tie (inconsistent)" = GPT-4 changed its verdict when A/B were swapped.
  inconsistent_as: tie

judge:
  backend: anthropic
  model: claude-opus-5-5
  effort: low
  max_tokens: 4000

# Local judge runs (llmeval-judge): keys with human votes, judged in both answer orders.
judge_run:
  turns: [1]
  n_keys: 400        # seeded random order, so a larger n extends a smaller run
  seed: 0
  max_tokens: 400

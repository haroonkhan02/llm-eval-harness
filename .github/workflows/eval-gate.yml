name: Eval gate

# Blocks a pull request when the candidate eval scores are worse than the baseline.
# evals/baseline.csv holds the accepted run, evals/candidate.csv the proposed one
# (one row per eval item: id, group, score; written by llmeval-scores or any eval).
on:
  pull_request:
    paths: ["evals/**", "src/llmeval/gate.py", ".github/workflows/eval-gate.yml"]
  push:
    branches: [main]
    paths: ["evals/**", "src/llmeval/gate.py", ".github/workflows/eval-gate.yml"]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas pyarrow pyyaml huggingface_hub
          pip install -e . --no-deps
      - name: Compare candidate with baseline
        run: |
          set -o pipefail
          llmeval-gate evals/baseline.csv evals/candidate.csv \
            --max-drop 0.02 --alpha 0.05 --allow-missing --json gate.json \
            | tee gate.txt
      - name: Job summary
        if: always()
        run: |
          { echo '```text'; cat gate.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
